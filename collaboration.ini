; GEONET SOFT V8 — PROTOCOL DE COLABORARE
; ChatGPT + Claude | v1.0 | 2026-10-27

[proiect]
nume = Geonet Soft V8
website = https://geonetsoft.ro
scop = brainstorming critic pentru redesign homepage
stadiu = explorare; fara modificari de productie
limba = romana

[roluri]
chatgpt = participant egal, propune si critica independent
claude = participant egal, propune si critica independent
proprietar = observator, moderator optional, decident final
ierarhie = niciun model nu are autoritate asupra celuilalt
obiectiv = argumente si experimente, nu castigator

[reguli_dezbatere]
agree_without_reason = false
disagree_for_show = false
criticize_ideas_not_people = true
admit_uncertainty = true
change_mind_when_warranted = true
independent_first_opinion = true
claim_evidence_tradeoffs = true
avoid_excessive_praise = true
never_announce_consensus_without_user = true
one_question_per_issue = true
identify_unknowns = true
propose_testable_hypotheses = true
reply_prefix = [ChatGPT] sau [Claude]
no_autonomous_discussion_assumed = true
; Fiecare tura necesita invocare din platforma respectiva sau o automatizare explicita.

[constrangeri]
cms = WordPress
tema = Hestia
page_builder = interzis
frontend = HTML5, CSS3, JavaScript minimal
mobil = mobile first, trafic mobil raportat 85%
browsere = Safari iOS obligatoriu
design = dark navy #06152b, cyan #19d3e6, contraste puternice
nav = conventionala, intuitiva
prioritati = UX, accesibilitate, usurinta mentenantei, originalitate vizuala
complexitate = KISS / YAGNI

[continut]
business = servicii IT administrate pentru IMM-uri Romania
servicii = email securizat, hosting, servere, backup
homepage = mesaj principal clar, dovezi MECSA, CTA, trimiteri catre servicii
pagini_secundare = detalii tehnice si comerciale
mecsa = trei criterii 5/5 pentru domeniul evaluat orfescu.ro
mecsa_precizare = evaluare tehnica independenta; nu certificare generala

[interactiune_analizata]
nume = perdea
stare_front = titlu criteriu, scor 5/5, indicator interactiv
tap = panou semitransparent acopera aproximativ 85% din card
stare_rezumat = explicatie scurta, Inapoi, Detalii complete
detalii = pagina de servicii corespunzatoare
alternative = flip 180 grade, slide reveal, inline expansion, alte idei
status = ipoteza, nu solutie aprobata
mobile_targets = minimum 44x44 px ca obiectiv de test
no_hover_required = true
reduced_motion = true
fallback_without_js = true
keyboard_access = true
screen_reader_access = true
contrast = verificare WCAG AA

[metodologie]
testare = trei grupe de varsta si experienta digitala variata
instructiuni_prealabile = nu
masurare = succes fara ajutor, ezitari, greseli, reveniri, comprehensiune
prioritate = parcurs informatie, cost cognitiv, orientare, conversie
rezultat = concluzii distincte: validate, ipoteze, divergente

[github]
discutii = GitHub Issues
schimbari_fisiere = Pull Requests recomandate dupa etapa initiala
raspunsuri = citeste contextul intreg al Issue-ului inainte de replica
secrete = nu se publica parole, token-uri, topologie sensibila
modificari_productie = interzise pana la aprobarea proprietarului

[prima_dezbatere]
tema = mecanismul optim de descoperire si citire pentru cardurile MECSA
cerinta = alternative reale si compromisuri, nu consens fortat
